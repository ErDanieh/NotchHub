[package]
name = "notchhub"
version.workspace = true
edition.workspace = true
description = "Gives your desktop's top edge a job: shelf, music, clipboard, calendar, news and a pixel pet."

[dependencies]
notchhub-core = { path = "../notchhub-core" }
notchhub-mpris = { path = "../notchhub-mpris" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
gdk4-x11 = "0.9"
x11rb = "0.13"
directories = "5"
async-channel = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
ksni = { version = "0.3", features = ["tokio"] }
libpulse-binding = "2"
libpulse-simple-binding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
poppler-rs = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
cairo-rs = { version = "0.20", features = ["pdf"] }
chrono = "0.4"

[package.metadata.deb]
name = "notchhub"
maintainer = "NotchHub contributors <noreply@users.noreply.github.com>"
copyright = "NotchHub contributors"
license-file = ["../../packaging/copyright", "0"]
extended-description = """\
NotchHub gives the top edge of your screen a job. A pill under the top bar opens into a panel with a file shelf, \
music with synced lyrics and a neon halo that can follow the beat, clipboard history, calendar, system stats, \
a file converter with a weight reducer for images, news by category from sources you choose, Docker control \
and a pixel pet that walks along the top. Runs on X11 and on Wayland through XWayland."""
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "ffmpeg, adwaita-icon-theme, gnome-shell-extension-appindicator | kde-plasma-desktop | xfce4-panel"
suggests = "kdeconnect, docker.io"
assets = [
    ["target/release/notchhub", "usr/bin/", "755"],
    ["../../packaging/notchhub.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icon.svg", "usr/share/icons/hicolor/scalable/apps/notchhub.svg", "644"],
]
